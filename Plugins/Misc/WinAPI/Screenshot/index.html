<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Screen Capture System</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-group { flex: 1; margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"] { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 13px;
        }
        
        input[type="text"]:focus {
            outline: none;
            background: #111111;
        }
        
        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
            margin-bottom: 8px;
        }
        
        .viewer-frame {
            width: 100%;
            height: 280px;
            background: #111111;
            border: 1px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .viewer-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .viewer-placeholder {
            color: #666666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .console { 
            background: #000000; 
            border: 1px dashed #444444; 
            padding: 10px; 
            height: 120px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 11px;
            line-height: 1.4;
            margin-top: 15px;
        }

        .msf-line { margin-bottom: 2px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Windows Screenshot Viewer ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Initializing display driver... awaiting bridge...
    </div>

    <div class="form-group">
        <label>> Transmitted Config (JSON Target)</label>
        <input type="text" id="targetJson" value="" readonly style="background: #111; color: #aaa; border-color: #444;">
    </div>

    <button id="captureBtn" onclick="executePlugin()" disabled>Trigger Screen Capture</button>

    <h3>Viewport Display</h3>
    <div class="viewer-frame">
        <span class="viewer-placeholder" id="imgPlaceholder">NO LIVE STREAM TRANSMITTED</span>
        <img id="screenshotTarget" src="" alt="Host Desktop Frame">
    </div>

    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/NebulaPulsar/DarkMatter",
            "ASPX/NebulaPulsar/DarkMatter",
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter",
        ]
    };

    let currentShellType = "";

    function updateJsonConfig() {
        const configObj = {
            "action": "screenshot"
        };
        document.getElementById('targetJson').value = JSON.stringify(configObj);
    }

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }
            consoleOutput.appendChild(div);
        });
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateJsonConfig();

        const statusBar = document.getElementById('statusBar');
        const captureBtn = document.getElementById('captureBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: GDI READY`;
                    captureBtn.disabled = false;
                    appendLog("[*] COUPLING CAPTURE DRIVER TO BRIDGE LINK.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] COMPILATION ABORTED. INSTANCE REQUIRES PHP ENVIRONMENT.`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. ACTIVE EMULATION ARCHITECTURE.");
                captureBtn.disabled = false;
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const jsonConfig = document.getElementById('targetJson').value;
        const imgTarget = document.getElementById('screenshotTarget');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        
        appendLog(`[*] STAGING DRAW INSTRUCTIONS...`);

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
                
                const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
                
                appendLog('[*] EXECUTING REMOTE FRAME BUFFER INTERCEPTION...');
                
                let base64Result = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
                if (base64Result.startsWith("ERROR://"))
                    throw new Error(base64Result);
                
                base64Result = base64Result.trim();

                if (base64Result.length < 200) {
                    try {
                        const decodedResult = atob(base64Result);
                        if (decodedResult.includes("ERROR") || decodedResult.includes("Failed")) {
                            appendLog("[-] " + decodedResult);
                            return;
                        }
                    } catch (decodeErr) {
                        appendLog("[-] RECEIVED INVALID RESPONSE: " + base64Result);
                        return;
                    }
                }

                if (base64Result && !base64Result.startsWith("[-]")) {
                    appendLog("[+] RAW BITSTREAM RECEIVED. DECODING GRAPHICS BUFFER...");
                    
                    imgTarget.src = "data:image/png;base64," + base64Result;
                    imgTarget.style.display = "block";
                    imgPlaceholder.style.display = "none";
                } else {
                    appendLog("[-] RECOVERY ABORTED: " + base64Result.toUpperCase());
                }
            } else {
                appendLog("[!] MOCK SCANNING DISPLAY DESRUPTOR...");
                setTimeout(() => {
                    imgTarget.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%23222'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='monospace'>[ MOCK SCREENSHOT WINDOW RES: 1920x1080 ]</text></svg>";
                    imgTarget.style.display = "block";
                    imgPlaceholder.style.display = "none";
                    appendLog("[+] MOCK FRAME RECEIVED SUCCESSFULLY.");
                }, 700);
            }
        } catch (e) {
            appendLog("[-] DISPLAY AGENT FAULT: " + e.message.toUpperCase());
        }
    }
</script>

</body>
</html>
