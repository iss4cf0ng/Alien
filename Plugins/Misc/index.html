<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Monochrome Terminal Core</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 30px;
        }
        
        .container { 
            width: 100%;
            max-width: 850px;
            background: #000000; 
            padding: 40px;
            border-radius: 0px; 
            border: 1px solid #ffffff; 
            text-align: center;
        }
        
        .wallpaper-image {
            width: 100%;
            height: 450px;
            object-fit: cover;
            object-position: center 20%;
            margin: 10px auto 30px auto;
            display: block;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .plugin-title { 
            margin: 20px 0 10px 0;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 8px;
            border-top: 1px solid #ffffff;
            padding-top: 20px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 15px;
            font-size: 13px;
            border: 1px dashed #ffffff;
            letter-spacing: 1px;
            margin-top: 20px;
            text-align: left;
            line-height: 1.4;
        }

        .msf-info { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <img src="aurora.png" alt="WALLPAPER" class="wallpaper-image">
    
    <div class="plugin-title">MISCELLANEOUS</div>
    
    <div class="status-bar">
        <span class="msf-info">[i]</span> We are all drifting in the digital ocean, counting the millseconds until our signals cross under the same starry night.
    </div>
</div>

</body>
</html>
