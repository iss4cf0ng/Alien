<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Socket Packet Sender</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group.col-3 { flex: 0 0 120px; }
        .form-group.full-width { width: 100%; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"], textarea, select { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 13px;
        }
        
        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            background: #111111;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }
        
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></path></svg>");
            background-repeat: no-repeat;
            background-position-x: 95%;
            background-position-y: 50%;
        }
        
        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Socket Packet Sender ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Initializing socket controller... awaiting bridge connection...
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label>> Target Host IP</label>
            <input type="text" id="uiHost" value="127.0.0.1" oninput="updateJsonConfig()">
        </div>
        <div class="form-group col-3">
            <label>> Port</label>
            <input type="text" id="uiPort" value="4444" oninput="updateJsonConfig()">
        </div>
        <div class="form-group col-3">
            <label>> Data Type</label>
            <select id="uiDataType" onchange="updateJsonConfig()">
                <option value="text">TEXT</option>
                <option value="hex">HEX</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>> Raw Data Payload</label>
        <textarea id="uiDataContent" oninput="updateJsonConfig()">Hello World!\n</textarea>
    </div>

    <div class="form-group">
        <label>> Transmitted Config (JSON Target)</label>
        <input type="text" id="targetJson" value="" readonly style="background: #111; color: #aaa; border-color: #444;">
    </div>

    <button id="sendBtn" onclick="executePlugin()" disabled>Transmit Packet</button>

    <h3>Transmission Logs & Response</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "PHP/v8.X/OneShell",
        ]
    };

    let currentShellType = "";

    function updateJsonConfig() {
        const host = document.getElementById('uiHost').value;
        const port = document.getElementById('uiPort').value;
        const dataType = document.getElementById('uiDataType').value;
        let dataContent = document.getElementById('uiDataContent').value;

        if (dataType === 'hex') {
            dataContent = dataContent.replace(/[\s,:\x2D]/g, ""); 
        }

        const configObj = {
            "host": host,
            "port": port,
            "type": dataType,
            "data": dataContent
        };

        document.getElementById('targetJson').value = JSON.stringify(configObj);
    }

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }

            consoleOutput.appendChild(div);
        });

        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateJsonConfig();

        const statusBar = document.getElementById('statusBar');
        const sendBtn = document.getElementById('sendBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: SOCKET READY`;
                    sendBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED WITH NATIVE NODE BRIDGE.");
                    appendLog("[*] PRE-FLIGHT COMPILER ACTIVE. READY TO SHIP BIND DATA.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. MODULE REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. STANDALONE DRY-RUN MODE SIMULATION.");
                sendBtn.disabled = false;
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const jsonConfig = document.getElementById('targetJson').value;
        const configParsed = JSON.parse(jsonConfig);
        
        appendLog(`[*] COMILING RAW DESCRIPTOR [TYPE: ${configParsed.type.toUpperCase()}]`);
        appendLog(`[*] TARGET ENDPOINT INTERFACE -> ${configParsed.host}:${configParsed.port}`);

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                const currentDir = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                
                const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
                
                appendLog('[*] PIPING STREAM THROUGH BRIDGE LAYER...');
                
                const result = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
                
                appendLog(result.toUpperCase());
            } else {
                appendLog(`[!] MOCK TRANSMITTING TO ${configParsed.host}:${configParsed.port}...`);
                setTimeout(() => {
                    appendLog(`[+] MOCK STATUS: SUCCESS (SENT ${configParsed.data.length} BYTES)`);
                }, 600);
            }
        } catch (e) {
            appendLog("[-] TRANSMISSION FAULT: " + e.message.toUpperCase());
        }
    }
</script>

</body>
</html>
