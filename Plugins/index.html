<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Monochrome Terminal Core</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        body { 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container { 
            width: 100%;
            max-width: 550px; 
            background: #000000; 
            padding: 30px; 
            border-radius: 0px; 
            border: 1px solid #ffffff; 
            text-align: center;
        }
        
        .earth-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 10px auto 25px auto;
            display: block;
        }

        .plugin-title { 
            margin: 15px 0 5px 0;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 6px;
            border-top: 1px solid #ffffff;
            padding-top: 15px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            font-size: 12px; 
            border: 1px dashed #ffffff; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            text-align: left;
        }

        .msf-info { color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    
    <img src="earth.png" alt="ALIEN" class="earth-image">
    
    <div class="plugin-title">PLUGINS</div>
    
    <div class="status-bar">
        <span class="msf-info">[*]</span> AWAITING MODULE SELECTION FROM TREEVIEW...
    </div>
</div>

</body>
</html>
