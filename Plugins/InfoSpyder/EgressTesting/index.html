<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Network Egress Testing</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 750px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px; 
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-group { margin-bottom: 15px; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        textarea { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
            resize: vertical;
            height: 90px;
        }
        textarea:focus {
            outline: none;
            background: #111111;
        }
        
        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        /* Listview / Table 樣式 */
        .listview-container {
            border: 1px solid #ffffff;
            max-height: 180px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        table.listview {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        table.listview th, table.listview td {
            padding: 8px 10px;
            border-bottom: 1px solid #333333;
        }
        table.listview th {
            background-color: #111111;
            color: #ffffff;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table.listview tr:hover {
            background-color: #111111;
        }

        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 130px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 12px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ Network Egress Testing ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] Initializing system controller... awaiting logs...
    </div>
    
    <div class="form-group">
        <label>> Target List (IP:Port or Host:Port, One per line)</label>
        <textarea id="targetListInput">8.8.8.8:53
1.1.1.1:443
api.ipify.org:80
google.com
firefox.com
github.com
microsoft.com</textarea>
    </div>

    <button id="scanBtn" onclick="executePlugin()" disabled>Start Egress Probe</button>

    <h3>Egress Status View</h3>
    <div class="listview-container">
        <table class="listview" id="statusTable">
            <thead>
                <tr>
                    <th>Target</th>
                    <th>Protocol</th>
                    <th>Status</th>
                    <th>Latency</th>
                    <th>Reason / Details</th>
                </tr>
            </thead>
            <tbody id="statusTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #666666;">Awaiting execution...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <h3>Raw Execution Console</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "PHP/v5.X/OneShell",
            "PHP/v7.X/OneShell",
            "PHP/v8.X/OneShell",
            "ASP/Classic/OneShell",
            "ASPX/JScript/OneShell",
            "ASPX/NebulaPulsar/DarkMatter",
            "ASHX/JScript/OneShell",
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/JScript/OneShell",
            "ASMX/NebulaPulsar/DarkMatter",
            "JSP/Nashorn/OneShell",
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter",
        ]
    };

    let currentShellType = "";

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line;
            }

            consoleOutput.appendChild(div);
        });

        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const scanBtn = document.getElementById('scanBtn');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: PROBE READY`;
                    scanBtn.disabled = false;
                    appendLog("[*] LINK ESTABLISHED.");
                    appendLog("[*] READY TO RUN EGRESS CONNECTIVITY PROBE.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. PLUGIN REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                    appendLog(`[-] NODE RUNNING: ${currentShellType}.`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. CORE OVERRIDE RE-ROUTE REQUIRED.");
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    function updateListView(probeResults) {
        const tbody = document.getElementById('statusTableBody');
        tbody.innerHTML = "";

        if (!Array.isArray(probeResults) || probeResults.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #666666;">No results found</td></tr>`;
            return;
        }

        probeResults.forEach(res => {
            const tr = document.createElement('tr');
            
            const isOpen = (res.status === "open" || res.success === true);
            const statusColor = isOpen ? "#2ecc71" : "#e74c3c";
            const statusText = isOpen ? "OPEN" : "BLOCKED";

            tr.innerHTML = `
                <td>${escapeHtml(res.target)}</td>
                <td>${escapeHtml(res.protocol || 'TCP')}</td>
                <td style="color: ${statusColor}; font-weight: bold;">${statusText}</td>
                <td>${res.latency ? res.latency + 'ms' : 'N/A'}</td>
                <td>${escapeHtml(res.reason || '')}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function executePlugin() {
        const rawText = document.getElementById('targetListInput').value;
        const lines = rawText.split('\n');
        const targets = [];
        lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed !== "") {
                targets.push(trimmed);
            }
        });

        if (targets.length === 0) {
            appendLog("[-] ERROR: No valid targets specified in the list.");
            return;
        }

        const jsonConfig = JSON.stringify({ targets: targets });

        appendLog(`[*] ALLOCATING EGRESS PAYLOAD FOR: ${currentShellType.toUpperCase()}`);
        appendLog(`[*] PARSED ${targets.length} TARGET ENDPOINTS INTO JSON CONFIG.`);

        const bridge = window.chrome.webview.hostObjects.nativeBridge;
        const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1);
        
        const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
        appendLog('[*] ENGAGING REMOTE EGRESS PROBE QUERY...');
        
        const egressResultRaw = await bridge.fnRun(jsonConfig, payloadCode, currentShellType);
        
        appendLog('[+] RECEIVED EGRESS PROBE RESULTS FROM TARGET NODE.');

        try {
            let jsonString = egressResultRaw;
            if (jsonString.includes("[+] SUCCESS\n")) {
                jsonString = jsonString.substring(jsonString.indexOf("[+] SUCCESS\n") + 12);
            } else if (jsonString.startsWith("[+] SUCCESS")) {
                jsonString = jsonString.replace("[+] SUCCESS", "").trim();
            }

            const probeResults = JSON.parse(jsonString);
            
            appendLog("[*] PARSED EGRESS RESULT MATRIX SUCCESSFULLY. UPDATING LISTVIEW...");
            
            let successCount = 0;
            let failCount = 0;

            if (Array.isArray(probeResults)) {
                probeResults.forEach(res => {
                    if (res.status === "open" || res.success === true) {
                        appendLog(`[+] EGRESS ALLOWED -> [${res.target}] via Protocol: ${res.protocol || 'TCP'} (Latency: ${res.latency || 'N/A'}ms)`);
                        successCount++;
                    } else {
                        appendLog(`[-] EGRESS BLOCKED -> [${res.target}] Reason: ${res.reason || 'Filtered/Timeout'}`);
                        failCount++;
                    }
                });
                
                updateListView(probeResults);
            } else {
                appendLog("--- RAW EGRESS OUTPUT ---");
                appendLog(egressResultRaw);
                return;
            }

            appendLog(`[+] ANALYSIS COMPLETE: ${successCount} OUTBOUND PATHS OPEN, ${failCount} BLOCKED.`);

        } catch (jsonErr) {
            appendLog("[!] PARSE NOTE: RECEIVED PLAIN TEXT RESPONSE INSTEAD OF JSON MATRIX.");
            appendLog("--- RAW EGRESS OUTPUT ---");
            appendLog(egressResultRaw);
        }
    }
</script>

</body>
</html>
